<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B3820"/>
      <stop offset="50%" stop-color="#C45C3B"/>
      <stop offset="100%" stop-color="#D97B5E"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF5ED"/>
      <stop offset="100%" stop-color="#EDD9B8"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Decorative circle top right -->
  <circle cx="400" cy="80" r="60" fill="rgba(255,255,255,0.06)"/>
  <circle cx="420" cy="60" r="35" fill="rgba(255,255,255,0.05)"/>

  <!-- Plant stem -->
  <line x1="256" y1="280" x2="256" y2="420" stroke="#EDD9B8" stroke-width="16" stroke-linecap="round" opacity="0.9"/>

  <!-- Left branch -->
  <path d="M256 340 C220 320 185 328 175 355" stroke="#EDD9B8" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Right branch -->
  <path d="M256 380 C292 360 327 368 337 395" stroke="#EDD9B8" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Main leaf / plant body -->
  <path d="M256 90
    C235 130 195 165 180 220
    C165 270 175 310 200 340
    C220 362 240 375 256 378
    C272 375 292 362 312 340
    C337 310 347 270 332 220
    C317 165 277 130 256 90Z"
    fill="url(#leaf)" opacity="0.93"/>

  <!-- Leaf vein -->
  <path d="M256 130 L256 350" stroke="#C45C3B" stroke-width="5" stroke-linecap="round" opacity="0.35"/>

  <!-- Left vein -->
  <path d="M256 200 C238 195 222 200 215 214" stroke="#C45C3B" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.3"/>

  <!-- Right vein -->
  <path d="M256 240 C274 235 290 240 297 254" stroke="#C45C3B" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.3"/>

  <!-- Bottom label -->
  <text x="256" y="478" font-family="Georgia, 'Times New Roman', serif" font-size="52"
    font-weight="bold" fill="#F2D5C8" text-anchor="middle" letter-spacing="6" opacity="0.88">BAF</text>
</svg>
